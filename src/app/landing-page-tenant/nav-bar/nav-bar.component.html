<!-- ============================================================
     HERO PRUEBA (estilo KEITHSTON / Sweet Treats)
     Solo preview: fondo único con todo el contenido superpuesto.
     ============================================================ -->
<div
  class="relative min-h-screen w-full bg-cover bg-center bg-no-repeat overflow-hidden"
  style="background-image: url('/assets/img/hero-bodegon.jpeg');">

  <!-- Navbar Flotante (arriba) -->
  <header class="hero-nav absolute top-0 left-0 w-full z-10 flex items-center px-8 lg:px-16 py-6 space-x-12 bg-gradient-to-b from-black/60 to-transparent">
    <!-- Logo + Nombre del negocio -->
    <div class="flex items-center gap-3 whitespace-nowrap">
      <img *ngIf="logoUrl" [src]="logoUrl" [alt]="bussinessName + ' logo'" class="w-10 h-10 object-contain rounded-full drop-shadow-[0_2px_2px_rgba(0,0,0,0.6)]" />
      <span class="hero-nav-brand text-white text-2xl lg:text-3xl font-bold tracking-wide">{{ bussinessName }}</span>
    </div>

    <!-- Menú en una sola fila, junto al logo (zona oscura) -->
    <nav class="flex items-center space-x-8">
      <a href="#promotions" (click)="scrollToSection('promotions', $event)" class="text-lg md:text-xl font-semibold tracking-wide text-gray-100 hover:text-amber-200 transition-colors duration-200 no-underline drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">Promociones</a>
      <a href="#menu" (click)="scrollToSection('menu', $event)" class="text-lg md:text-xl font-semibold tracking-wide text-gray-100 hover:text-amber-200 transition-colors duration-200 no-underline drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">Menu</a>
      <a href="#rewards" (click)="scrollToSection('rewards', $event)" class="text-lg md:text-xl font-semibold tracking-wide text-gray-100 hover:text-amber-200 transition-colors duration-200 no-underline drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">Registrate</a>
      <a href="#" (click)="scrollToFooter($event)" class="text-lg md:text-xl font-semibold tracking-wide text-gray-100 hover:text-amber-200 transition-colors duration-200 no-underline drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">Nosotros</a>
    </nav>
  </header>

  <!-- Bloque de texto y botones (sobre el lado oscuro izquierdo) -->
  <div class="relative max-w-3xl pl-8 lg:pl-16 pt-32 lg:pt-48 pb-16">
    <p class="text-amber-200/90 text-xl md:text-3xl tracking-[0.2em] uppercase mb-3">{{ bussinessName }}</p>

    <h1 class="hero-slogan text-6xl md:text-7xl lg:text-8xl text-white font-bold leading-[1.05] mb-10">
      {{ since }}
    </h1>

    <div class="flex items-center space-x-6 md:space-x-8">
      <a href="#" class="bg-[#a3432b] hover:bg-[#8b3823] text-white text-lg md:text-xl px-10 py-4 rounded-md font-medium transition-colors shadow-lg inline-block">
        Shop Now
      </a>
      <a href="#" class="text-amber-100 hover:text-white text-lg md:text-xl font-medium transition-colors">
        Learn More
      </a>
    </div>
  </div>
</div>
