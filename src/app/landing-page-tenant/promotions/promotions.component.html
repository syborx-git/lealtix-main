<section class="promos-section" id="promotions" *ngIf="promotions.length > 0">
  <div class="promos-header">
    <span class="promos-subtitle">OFERTAS LIMITADAS</span>
    <h2 class="promos-title">Promociones activas</h2>
  </div>

  <div class="carousel-wrapper">
    <!-- Flecha Izquierda -->
    <button type="button" (click)="prevPromo()" class="nav-arrow left-arrow" aria-label="Anterior">‹</button>

    <!-- Tarjeta Dinámica -->
    <div class="promo-banner-card" *ngIf="currentSlide as slide">
      <div class="banner-image-wrapper">
        <img
          *ngIf="slide.image; else promoFallback"
          [src]="slide.image"
          [alt]="slide.title"
          class="banner-image"
        />
        <ng-template #promoFallback>
          <div class="banner-fallback">
            <span class="material-symbols-outlined text-5xl text-neutral-600">local_fire_department</span>
          </div>
        </ng-template>
      </div>

      <div class="banner-info">
        <div class="badge-row">
          <span class="promo-badge">{{ slide.badge }}</span>
        </div>

        <div class="text-content">
          <h3 class="banner-heading">{{ slide.title }}</h3>
          <p class="banner-description">{{ slide.description }}</p>
        </div>

        <div class="validity-row">
          <span class="clock-icon">🕒</span>
          <span>{{ slide.validity }}</span>
        </div>

        <div class="coupon-code-box" *ngIf="slide.code">
          <span class="code-label">CÓDIGO:</span>
          <span class="code-text">{{ slide.code }}</span>
        </div>

        <button type="button" class="claim-btn">{{ slide.buttonText }}</button>
      </div>
    </div>

    <!-- Flecha Derecha -->
    <button type="button" (click)="nextPromo()" class="nav-arrow right-arrow" aria-label="Siguiente">›</button>
  </div>

  <!-- Puntos del Carrusel -->
  <div class="carousel-dots">
    <span
      *ngFor="let slide of slides; let i = index"
      [class.active]="i === activePromoIndex"
      (click)="setPromo(i)"
      class="dot"
    ></span>
  </div>
</section>
