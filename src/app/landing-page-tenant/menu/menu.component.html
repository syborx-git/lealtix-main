<section class="py-12 md:py-24 px-4 md:px-6 bg-white text-neutral-900" id="menu">
  <div class="max-w-7xl mx-auto">
    <div class="flex flex-col items-center text-center mb-8 md:mb-12 gap-6 md:gap-8">
      <div>
        <h2 class="text-3xl md:text-5xl font-black mb-4 md:mb-6">Nuestro Menu</h2>
        <div class="flex flex-wrap gap-2 md:gap-4 justify-center">
          <button
            *ngFor="let catName of getCategoryNames()"
            (click)="selectCategory(catName)"
            [ngClass]="{
              'bg-[#a3432b] text-white': selectedCategory === catName,
              'bg-neutral-200 hover:bg-neutral-300 text-neutral-700': selectedCategory !== catName
            }"
            class="px-4 md:px-6 py-2 rounded-full font-bold text-xs md:text-sm transition-colors">
            {{ catName }}
          </button>
        </div>
      </div>
    </div>

    <!-- Catálogo de productos: grid de tarjetas -->
    <div class="catalog-container">
      <div class="products-grid">
        <div *ngFor="let producto of getFilteredProducts()" class="product-card">
          <div class="product-image-container">
            <img
              *ngIf="productImage(producto)"
              [src]="productImage(producto)"
              [alt]="producto.prod"
              class="product-image"
              onerror="this.style.display='none'"
            />
            <ng-container *ngIf="!productImage(producto)">
              <span class="material-symbols-outlined text-white/30 text-5xl">coffee</span>
            </ng-container>
          </div>

          <div class="product-details">
            <div class="top-row">
              <span class="product-price">{{ producto.precio }}</span>
              <button type="button" class="info-btn" [title]="producto.descProd">i</button>
            </div>

            <div class="bottom-row">
              <h3 class="product-title">{{ producto.prod }}</h3>
              <button type="button" class="add-btn">Add</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
