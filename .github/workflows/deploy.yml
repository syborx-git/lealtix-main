name: CI/CD Main Web Hetzner

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: hetzner-deploy-main
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # 1. CI: Validación en Pull Requests y Pushes
  # -------------------------------------------------------------
  build-check:
    name: Validar Compilación Angular Main
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Compilar Angular para producción
        run: npm run build

  # -------------------------------------------------------------
  # 2. CD: Despliegue en Hetzner (Sólo al fusionar o empujar a 'main')
  # -------------------------------------------------------------
  deploy:
    name: Desplegar en Hetzner (Main)
    needs: build-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            echo "🚀 [Main] Desplegando Main Web desde rama main..."
            cd /var/www/lealtix/lealtix-main
            # Forzar sincronización exacta con origin/main
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
            echo "HEAD de Main Web: $(git rev-parse --short HEAD)"

            cd /var/www/lealtix
            echo "===== Reconstruyendo contenedor lealtix-main ====="
            docker compose build --no-cache lealtix-main
            docker compose up -d --force-recreate --no-deps lealtix-main

            echo "===== Monitoreo y logs iniciales ====="
            sleep 8
            docker compose ps
            docker compose logs --tail=40 lealtix-main || true

            echo "===== Healthcheck de Main Web ====="
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/ || curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || echo 000)
              echo "Intento $i: HTTP $code"
              if [ "$code" = "200" ]; then
                echo "✅ Main Web respondiendo con éxito (HTTP 200)!"
                break
              fi
              if [ "$i" = "20" ]; then
                echo "❌ Main Web no respondió 200 tras el despliegue."
                docker compose logs --tail=100 lealtix-main
                exit 1
              fi
              sleep 4
            done
            echo "🎉 Main Web desplegado y activo!"
