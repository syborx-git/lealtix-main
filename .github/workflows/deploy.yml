name: Deploy Main Web to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"
            echo "🚀 Desplegando Main Web desde rama $BRANCH..."
            cd /var/www/lealtix/lealtix-main
            git fetch --all
            git checkout $BRANCH || git checkout -B $BRANCH origin/$BRANCH
            git reset --hard origin/$BRANCH
            git pull origin $BRANCH || true
            cd /var/www/lealtix
            docker compose build --no-cache lealtix-main
            docker compose up -d lealtix-main
            echo "✅ Main Web actualizado con éxito!"
