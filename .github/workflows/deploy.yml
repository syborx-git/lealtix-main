name: Deploy Main Web to Hetzner

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            BRANCH="${{ github.ref_name }}"
            echo "🚀 Desplegando Main Web desde rama $BRANCH..."
            cd /var/www/lealtix/lealtix-main
            git checkout $BRANCH
            git pull origin $BRANCH
            cd /var/www/lealtix
            docker compose up -d --build lealtix-main
            echo "✅ Main Web actualizado con éxito!"
